<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#17153a" />
      <stop offset="100%" stop-color="#0a0a14" />
    </linearGradient>

    <!-- Vibrant primary neon gradient (Violet -> Magenta -> Rose) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Accent neon gradient (Cyan -> Sky -> Blue) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop shadow for the squircle container -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base container: Modern rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="33" y="33" width="446" height="446" rx="103" ry="103" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.25" />

  <!-- Background decorative film reel dots / timeline tick grid -->
  <g opacity="0.15">
    <circle cx="100" cy="88" r="8" fill="#ffffff" />
    <circle cx="140" cy="88" r="8" fill="#ffffff" />
    <circle cx="180" cy="88" r="8" fill="#ffffff" />
    <circle cx="220" cy="88" r="8" fill="#ffffff" />
    <circle cx="260" cy="88" r="8" fill="#ffffff" />
    <circle cx="300" cy="88" r="8" fill="#ffffff" />
    <circle cx="340" cy="88" r="8" fill="#ffffff" />
    <circle cx="380" cy="88" r="8" fill="#ffffff" />
    <circle cx="420" cy="88" r="8" fill="#ffffff" />

    <circle cx="100" cy="424" r="8" fill="#ffffff" />
    <circle cx="140" cy="424" r="8" fill="#ffffff" />
    <circle cx="180" cy="424" r="8" fill="#ffffff" />
    <circle cx="220" cy="424" r="8" fill="#ffffff" />
    <circle cx="260" cy="424" r="8" fill="#ffffff" />
    <circle cx="300" cy="424" r="8" fill="#ffffff" />
    <circle cx="340" cy="424" r="8" fill="#ffffff" />
    <circle cx="380" cy="424" r="8" fill="#ffffff" />
    <circle cx="420" cy="424" r="8" fill="#ffffff" />
  </g>

  <!-- Left Sail / Blade ("Vela" + Left Cutter arm) -->
  <path d="M 128 140 
           C 128 128 142 120 152 128 
           L 290 236 
           C 298 242 298 254 290 260 
           L 152 368 
           C 142 376 128 368 128 356 
           Z" 
        fill="url(#primaryGrad)" 
        filter="url(#subtleGlow)" />

  <!-- Right Play Wing / Precision Scissor Cut Line -->
  <path d="M 230 148 
           C 230 138 242 132 250 138 
           L 384 242 
           C 392 248 392 258 384 264 
           L 250 368 
           C 242 374 230 368 230 358 
           L 230 296 
           L 316 253 
           L 230 210 
           Z" 
        fill="url(#accentGrad)" 
        filter="url(#glow)" />

  <!-- Dynamic Center Cutting Split Razor (Stylized Cut line between the two wings) -->
  <path d="M 276 116 L 244 396" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-dasharray="14 10" 
        stroke-opacity="0.8" />

  <!-- Mini playhead point on the cut line -->
  <circle cx="258" cy="270" r="10" fill="#ffffff" filter="url(#glow)" />
  <circle cx="258" cy="270" r="5" fill="#c026d3" />
</svg>
